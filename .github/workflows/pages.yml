name: Test and deploy daily tarot

on:
  push:
    branches: [codex/pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify JavaScript and all functional assertions
        run: |
          node --version
          node --check dist/core.js
          node --check dist/app.js
          node test.cjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload only static application files
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy public web application
        id: deployment
        uses: actions/deploy-pages@v5
